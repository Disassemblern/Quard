name: BI

# Also on app migrations: one that breaks a bi view fails here first
on:
    push:
        branches: [main]
        paths: ["bi/**", "db/migrations/**", ".github/workflows/bi.yml"]
    pull_request:
        paths: ["bi/**", "db/migrations/**", ".github/workflows/bi.yml"]

jobs:
    sql:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: quard
                    POSTGRES_PASSWORD: quard
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U quard"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        env:
            TEST_DATABASE_URL: postgres://quard:quard@127.0.0.1:5432/postgres
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v6
            - run: uv sync --directory bi --locked
            - run: uv run --directory bi ruff check
            - run: uv run --directory bi ruff format --check
            - run: uv run --directory bi pytest
