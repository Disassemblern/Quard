name: BI

# Also on app migrations: one that breaks a bi view fails here first
on:
    push:
        branches: [main]
        paths: ["bi/**", "db/migrations/**", ".github/workflows/bi.yml"]
    pull_request:
        paths: ["bi/**", "db/migrations/**", ".github/workflows/bi.yml"]
    # Run by hand: Actions > BI > Run workflow, or gh workflow run BI
    workflow_dispatch:

jobs:
    sql:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: quard
                    POSTGRES_PASSWORD: quard
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U quard"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        env:
            TEST_DATABASE_URL: postgres://quard:quard@127.0.0.1:5432/postgres
            # Lets the tests sign in as bi_reader
            BI_READER_PASSWORD: ci-only
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v6
            - run: uv sync --directory bi --locked
            - run: uv run --directory bi ruff check
            - run: uv run --directory bi ruff format --check
            - run: uv run --directory bi pytest

    # Best Practice Analyzer on the semantic model. Severity 3 fails.
    model:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - name: Download Tabular Editor 2.29.0
              shell: pwsh
              run: |
                  $url = "https://github.com/TabularEditor/TabularEditor/releases/download/2.29.0/TabularEditor.Portable.zip"
                  Invoke-WebRequest $url -OutFile te.zip
                  $sha = "C0D3A7ABDA4572BAAF3AEEDF9CB342CE7AD4D9840E6438D6B13DF02267D308A4"
                  if ((Get-FileHash te.zip).Hash -ne $sha) { throw "Unexpected Tabular Editor zip" }
                  Expand-Archive te.zip -DestinationPath te
            - name: Run BPA
              shell: pwsh
              run: |
                  $te = Start-Process -FilePath "te\TabularEditor.exe" -Wait -PassThru -NoNewWindow `
                      -ArgumentList '"bi\powerbi\Quard.SemanticModel\definition" -A "bi\powerbi\bpa-rules.json" -G'
                  exit $te.ExitCode
